name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # uv picks the interpreter from .python-version on its own, so CI cannot drift onto
      # whatever it would resolve for requires-python = ">=3.12". --locked fails the run when
      # uv.lock has drifted from pyproject.toml, instead of quietly re-resolving it.
      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest

      # The example profile doubles as a fixture: if it stops validating, the docs are lying.
      - name: Validate the example profile
        run: uv run resume-tailor profile validate examples/master-profile.yaml
